name: Report a problem
description: Report a problem in the curated Awesome GitHub Job Boards README or complete website catalog.
title: "Problem: owner/repository"
labels:
  - correction
body:
  - type: input
    id: repository
    attributes:
      label: Repository or entry
      placeholder: frontendbr/vagas
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where is the problem?
      options:
        - Curated README
        - Complete website catalog
        - Both
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem type
      options:
        - Broken link
        - Duplicate entry
        - Inactive repository
        - Incorrect country or region
        - Incorrect locale or scope
        - Not a GitHub Issues job board
        - Unsafe or suspicious link
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain what should be fixed and include supporting links. Catalog source changes may be redirected to the openings.dev source request workflow.
    validations:
      required: true
