name: Nominate a curated job board
description: Nominate an exceptional GitHub job board for editorial review in Awesome GitHub Job Boards.
title: "Nominate: owner/repository"
labels:
  - addition
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Use the GitHub owner/repository format.
      placeholder: frontendbr/vagas
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        This form is for editorial nominations to the curated README. Inclusion is not guaranteed.

        To browse the complete catalog or request an eligible source, use the [openings.dev community directory](https://openings.dev/communities/) instead.
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://github.com/frontendbr/vagas
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Region
      options:
        - Global
        - Africa
        - Asia
        - Europe
        - North America
        - South America
        - Oceania
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
      placeholder: Brazil
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale
      description: Use a BCP 47 locale when possible.
      placeholder: pt-BR
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - global
        - national
        - regional
        - city
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Editorial evidence
      description: Link to recent GitHub-hosted job activity and explain why this board is notably useful, active, and trustworthy.
      placeholder: https://github.com/frontendbr/vagas/issues
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why should this board be curated?
      description: Describe its audience, track record, moderation, and value to readers of Awesome GitHub Job Boards.
    validations:
      required: true
