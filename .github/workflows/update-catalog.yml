name: Update Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout public catalog
        uses: actions/checkout@v4
        with:
          repository: openings-dev/data-pipeline
          ref: main
          path: .catalog-data

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test catalog generator
        run: npm test

      - name: Generate directory
        run: npm run generate -- .catalog-data/src/modules/catalog/repositories.json

      - name: Commit changed catalog
        run: |
          if git diff --quiet -- _data/catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/catalog.json
          git commit -m "data: refresh job board catalog"
          git push
