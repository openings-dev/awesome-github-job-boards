title: "Awesome GitHub Issues Job Boards"
description: "A curated list of community job boards and job-tracking repositories powered by GitHub Issues."
url: "https://openings-dev.github.io"
baseurl: "/awesome-github-issues-job-boards"
repository: "openings-dev/awesome-github-issues-job-boards"
theme: "jekyll-theme-cayman"
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
markdown: "kramdown"
highlighter: "rouge"
kramdown:
  input: GFM
exclude:
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - SECURITY.md
  - .github/
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
