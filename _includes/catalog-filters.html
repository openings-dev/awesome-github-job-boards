<form class="catalog-filters" role="search" aria-label="Filter job boards">
  <fieldset>
    <legend>Filter job board sources</legend>
    <div class="catalog-filters__grid">
      <div class="catalog-field catalog-field--search"><label for="catalog-search">Search repositories</label><input id="catalog-search" data-catalog-search type="search" name="query" autocomplete="off" placeholder="Repository, owner, or description"></div>
      <div class="catalog-field"><label for="catalog-region">Region</label><select id="catalog-region" data-catalog-filter="region" name="region"><option value="">All regions</option></select></div>
      <div class="catalog-field"><label for="catalog-country">Country</label><select id="catalog-country" data-catalog-filter="country" name="country"><option value="">All countries</option></select></div>
      <div class="catalog-field"><label for="catalog-locale">Locale</label><select id="catalog-locale" data-catalog-filter="locale" name="locale"><option value="">All locales</option></select></div>
      <div class="catalog-field"><label for="catalog-scope">Scope</label><select id="catalog-scope" data-catalog-filter="scope" name="scope"><option value="">All scopes</option></select></div>
      <button class="catalog-filters__clear" id="catalog-clear" data-catalog-clear type="button">Clear filters</button>
    </div>
  </fieldset>
</form>
