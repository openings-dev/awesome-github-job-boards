<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/catalog.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="site-shell site-header__inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Awesome GitHub Job Boards home">
          <span class="site-brand__mark" aria-hidden="true">GH</span>
          <span>Awesome GitHub Job Boards</span>
        </a>
        <nav aria-label="Primary navigation"><a href="https://github.com/{{ site.repository }}">Contribute on GitHub</a></nav>
      </div>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <div class="site-shell site-footer__inner">
        <p>Maintained by the community for people who prefer open, inspectable job sources.</p>
        <a href="https://github.com/{{ site.repository }}">View the repository</a>
      </div>
    </footer>
    <script type="module" src="{{ '/assets/js/catalog.mjs' | relative_url }}"></script>
  </body>
</html>
