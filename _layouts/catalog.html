<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">{% seo %}
  <script>try{var t=localStorage.getItem("openings-theme");document.documentElement.classList.add(t==="dark"||t==="light"?t:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/catalog.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><div class="site-shell site-header__inner">
  <a class="site-brand" href="https://openings.dev" aria-label="Openings home"><img class="site-brand__light" src="{{ '/assets/brand/openings-wordmark-dark.svg' | relative_url }}" alt="openings.dev"><img class="site-brand__dark" src="{{ '/assets/brand/openings-wordmark-light.svg' | relative_url }}" alt=""></a>
  <nav aria-label="Primary navigation"><a href="https://github.com/{{ site.repository }}#readme">README</a><a href="https://openings.dev">Find jobs</a><a href="https://github.com/{{ site.repository }}/blob/main/CONTRIBUTING.md">Contribute</a></nav>
  <div class="theme-picker" role="group" aria-label="Color theme"><button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="system">System</button></div>
</div></header>
<main id="main-content">{{ content }}</main>
<footer class="site-footer"><div class="site-shell site-footer__inner"><p>A community source catalog by <a href="https://openings.dev">openings.dev</a>.</p><nav aria-label="Footer navigation"><a href="https://github.com/{{ site.repository }}#readme">Methodology</a><a href="https://github.com/{{ site.repository }}/blob/main/CONTRIBUTING.md">Contribute</a><a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">License</a></nav></div></footer>
<script type="module" src="{{ '/assets/js/theme.mjs' | relative_url }}"></script><script type="module" src="{{ '/assets/js/catalog.mjs' | relative_url }}"></script>
</body></html>
